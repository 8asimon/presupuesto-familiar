<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuesto Familiar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #222536;
    --border: #2e3148;
    --text: #e8eaf0;
    --text2: #9ca3af;
    --text3: #6b7280;
    --blue: #4f7cf7;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; background: linear-gradient(135deg, #4f7cf7, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-right { font-size: 12px; color: var(--text3); }

  .tabs { display: flex; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; }
  .tab { padding: 14px 20px; font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  .content { padding: 24px; max-width: 1400px; margin: 0 auto; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .metric { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .metric-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .metric-value { font-size: 22px; font-weight: 600; }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .yellow { color: var(--yellow); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-title { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  .progress-item { margin-bottom: 10px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; flex-wrap: wrap; }
  .progress-name { font-size: 13px; color: var(--text); }
  .progress-vals { font-size: 11px; color: var(--text3); }
  .progress-disponible { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .progress-disponible .disp-label { color: var(--text3); }
  .progress-disponible .disp-val { font-weight: 600; }
  .progress-disponible.pos .disp-val { color: var(--green); }
  .progress-disponible.neg .disp-val { color: var(--red); }
  .progress-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width .4s; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-ok { background: rgba(52,211,153,.15); color: var(--green); }
  .badge-warn { background: rgba(251,191,36,.15); color: var(--yellow); }
  .badge-danger { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-complete { background: rgba(52,211,153,.25); color: var(--green); border: 1px solid rgba(52,211,153,.5); }

  .cat-header { padding: 10px 12px; border-radius: 8px; background: var(--bg3); margin-bottom: 10px; margin-top: 16px; }
  .cat-header:first-child { margin-top: 0; }
  .cat-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cat-name { font-size: 12px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .05em; }
  .cat-stats { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text3); gap: 12px; flex-wrap: wrap; }
  .cat-stat { display: flex; gap: 4px; }
  .cat-stat .val { font-weight: 600; }
  .cat-stat.pres .val { color: var(--text2); }
  .cat-stat.gast .val { color: var(--blue); }
  .cat-stat.disp.pos .val { color: var(--green); }
  .cat-stat.disp.neg .val { color: var(--red); }
  .cat-pct { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }

  .tx-list { max-height: 500px; overflow-y: auto; }
  .tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tx-row:last-child { border-bottom: none; }
  .tx-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .tx-amount { font-size: 13px; font-weight: 600; color: var(--red); flex-shrink: 0; }
  .tx-count { font-size: 11px; color: var(--text3); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .tx-search { background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 6px 10px; border-radius: 6px; width: 150px; outline: none; }
  .tx-search:focus { border-color: var(--blue); }
  .tx-filter { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .tx-filter.active { background: var(--blue); color: white; border-color: var(--blue); }
  .tx-filters { display: flex; gap: 6px; flex-wrap: wrap; }

  .flujo-table { width: 100%; border-collapse: collapse; font-size: 12px; overflow-x: auto; display: block; }
  .flujo-table th { text-align: right; font-size: 11px; font-weight: 500; color: var(--text3); padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .flujo-table th:first-child { text-align: left; }
  .flujo-table td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .flujo-table td:first-child { text-align: left; font-weight: 500; color: var(--text2); }
  .flujo-table tr.gastos td { color: var(--red); }
  .flujo-table tr.ingreso td { color: var(--green); }
  .flujo-table tr.resultado td { font-weight: 600; }
  .flujo-table tr.acumulado { background: rgba(79,124,247,.05); }
  .flujo-table tr.acumulado td { color: var(--blue); font-weight: 600; }

  .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text3); font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert-banner { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: var(--red); }
  .chart-wrap { position: relative; height: 340px; }

  .cat-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .cat-pill { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); font-size: 11px; padding: 5px 10px; border-radius: 20px; cursor: pointer; transition: all .2s; }
  .cat-pill:hover { color: var(--text); }
  .cat-pill.active { background: var(--blue); color: white; border-color: var(--blue); }

  .evo-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .evo-stat { background: var(--bg3); padding: 10px 12px; border-radius: 8px; }
  .evo-stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .evo-stat-value { font-size: 15px; font-weight: 600; }
  .evo-stat-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

  .rec-card { background: linear-gradient(135deg, rgba(79,124,247,.1), rgba(167,139,250,.1)); border: 1px solid rgba(79,124,247,.3); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .rec-card.warn { background: linear-gradient(135deg, rgba(251,191,36,.1), rgba(248,113,113,.1)); border-color: rgba(251,191,36,.3); }
  .rec-card.danger { background: linear-gradient(135deg, rgba(248,113,113,.1), rgba(220,38,38,.1)); border-color: rgba(248,113,113,.3); }
  .rec-icon { font-size: 20px; flex-shrink: 0; line-height: 1; }
  .rec-body { flex: 1; }
  .rec-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; color: var(--text); }
  .rec-desc { font-size: 12px; color: var(--text2); line-height: 1.4; }
  .rec-desc b { color: var(--text); }
  .rec-empty { color: var(--text3); font-size: 13px; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="header">
  <h1>💰 Presupuesto Familiar</h1>
  <div class="header-right" id="last-update">Cargando...</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="setTab('simon')">Simón</div>
  <div class="tab" onclick="setTab('alejandra')">Alejandra</div>
  <div class="tab" onclick="setTab('hogar')">Hogar</div>
</div>

<div class="content" id="content">
  <div class="loading"><div class="spinner"></div>Cargando datos...</div>
</div>

<script>
const SHEET_ID = '1-2q9EyhkTXmYILgS5mnQSpAsjWN4TwOnmVvr9CRYgts';
const API = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=`;

const HOJAS_PRESUPUESTO = {
  simon: 'Presupuesto Simón',
  alejandra: 'Presupuesto Alejandra',
  hogar: 'Presupuesto Hogar'
};

const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function nombreMes(ym) {
  const [y, m] = ym.split('-');
  const idx = parseInt(m) - 1;
  if (idx >= 0 && idx < 12) return MESES_ES[idx] + " '" + String(y).substring(2);
  return ym;
}

let currentTab = 'simon';
let allData = {};
let charts = {};
let txFilter = 'all';
let txSearch = '';
let catSeleccionada = null;
// historial[tab] = { meses: ['2026-04', ...], porCat: { 'Hogar': { '2026-04': 123, ... }, ... } }
let historial = { simon: null, alejandra: null, hogar: null };

const CAT_ICONS = {
  'Hogar':'🏠','Comida':'🍔','Transporte':'🚗','Deudas':'💳',
  'Entretenimiento':'🎉','Tranquilidad Financiera':'💰','Salud':'💊','Por Definir':'❓'
};

const CAT_COLORS = {
  'Hogar': '#4f7cf7',
  'Comida': '#f59e0b',
  'Transporte': '#fbbf24',
  'Deudas': '#f87171',
  'Entretenimiento': '#a78bfa',
  'Tranquilidad Financiera': '#34d399',
  'Salud': '#06b6d4',
  'Por Definir': '#6b7280'
};

function fmt(n) { return '$' + Math.round(n||0).toLocaleString('es-CO'); }
function fmtS(n) { const a=Math.abs(n||0); return (n<0?'-':'')+'$'+(a>=1000000?(a/1000000).toFixed(1)+'M':a>=1000?Math.round(a/1000)+'k':Math.round(a)); }
function pct(g,p) { return p>0?Math.round(g/p*100):0; }
function barColor(p) { return p>100?'var(--red)':p>=100?'var(--green)':p>=90?'var(--yellow)':'var(--blue)'; }

function parseFecha(v) {
  if (!v) return null;
  if (v instanceof Date) return v;
  if (typeof v === 'string') {
    const dateMatch = v.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
    if (dateMatch) {
      return new Date(+dateMatch[1], +dateMatch[2], +dateMatch[3], +(dateMatch[4]||0), +(dateMatch[5]||0));
    }
    const d = new Date(v);
    if (!isNaN(d.getTime())) return d;
  }
  return null;
}

function fmtFecha(v) {
  const d = parseFecha(v);
  if (!d) return String(v||'').substring(0,16);
  return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
         d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}

function mesDeFecha(v) {
  const d = parseFecha(v);
  if (!d) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

// Fetch "raw" sin encabezado — porque las hojas de presupuesto tienen filas de texto, no una tabla
async function fetchSheetRaw(name) {
  const url = API + encodeURIComponent(name) + '&headers=0';
  const res  = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
  const rows = json.table.rows.map(r => r.c.map(cell => cell ? cell.v : null));
  return rows;
}

async function fetchSheet(name) {
  const url = API + encodeURIComponent(name);
  const res  = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
  const cols = json.table.cols.map(c => c.label);
  const rows = json.table.rows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => { obj[cols[i]] = cell ? cell.v : null; });
    return obj;
  });
  return rows;
}

// Parsea la hoja "Presupuesto X" buscando el bloque "HISTORIAL GASTOS POR CATEGORÍA"
// Devuelve { meses: ['2026-04', ...], porCat: { 'Hogar': { '2026-04': 123, ... }, ... } }
function parsearHistorial(rows) {
  if (!rows || !rows.length) return { meses: [], porCat: {} };

  // Encontrar la fila que empieza con "HISTORIAL GASTOS"
  let startIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    const first = String(rows[i][0] || '').toUpperCase();
    if (first.includes('HISTORIAL') && first.includes('CATEGOR')) {
      startIdx = i;
      break;
    }
  }
  if (startIdx === -1) return { meses: [], porCat: {} };

  // La siguiente fila es encabezados: ['Categoría', '2026-04', '2026-05', ...]
  const headerRow = rows[startIdx + 1];
  if (!headerRow) return { meses: [], porCat: {} };

  // Extraer meses (celdas 2 en adelante)
  const meses = [];
  for (let i = 1; i < headerRow.length; i++) {
    const v = headerRow[i];
    if (v === null || v === undefined || v === '') continue;
    let mesStr = '';
    if (v instanceof Date) {
      mesStr = v.getFullYear() + '-' + String(v.getMonth()+1).padStart(2,'0');
    } else if (typeof v === 'string') {
      const m = v.match(/(\d{4})-(\d{1,2})/);
      if (m) mesStr = m[1] + '-' + String(m[2]).padStart(2,'0');
      else {
        const dm = v.match(/Date\((\d+),(\d+)/);
        if (dm) mesStr = dm[1] + '-' + String(+dm[2]+1).padStart(2,'0');
      }
    } else if (typeof v === 'number') {
      // Serial number de fecha
      const d = new Date((v - 25569) * 86400 * 1000);
      mesStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    }
    if (mesStr) meses.push(mesStr);
  }

  // Filas de categoría hasta encontrar "TOTAL GASTOS" o línea vacía
  const porCat = {};
  for (let i = startIdx + 2; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[0]) break;
    const cat = String(row[0]).trim();
    if (cat.toUpperCase().includes('TOTAL') || cat === '—' || cat === '') break;

    porCat[cat] = {};
    for (let j = 0; j < meses.length; j++) {
      const val = parseFloat(row[j + 1]) || 0;
      porCat[cat][meses[j]] = val;
    }
  }

  return { meses, porCat };
}

async function loadAll() {
  try {
    const [sp, ap, hp, sf, af, hf, tx, histSimon, histAle, histHogar] = await Promise.all([
      fetchSheet('LS_Simon_Progreso'),
      fetchSheet('LS_Alejandra_Progreso'),
      fetchSheet('LS_Hogar_Progreso'),
      fetchSheet('LS_Simon_Flujo'),
      fetchSheet('LS_Alejandra_Flujo'),
      fetchSheet('LS_Hogar_Flujo'),
      fetchSheet('Transacciones'),
      fetchSheetRaw(HOJAS_PRESUPUESTO.simon),
      fetchSheetRaw(HOJAS_PRESUPUESTO.alejandra),
      fetchSheetRaw(HOJAS_PRESUPUESTO.hogar),
    ]);
    allData = { simon: { progreso: sp, flujo: sf }, alejandra: { progreso: ap, flujo: af }, hogar: { progreso: hp, flujo: hf }, tx };
    historial.simon = parsearHistorial(histSimon);
    historial.alejandra = parsearHistorial(histAle);
    historial.hogar = parsearHistorial(histHogar);
    document.getElementById('last-update').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CO');
    renderTab(currentTab);
  } catch(e) {
    console.error(e);
    document.getElementById('content').innerHTML = `<div class="loading">Error cargando datos: ${e.message}</div>`;
  }
}

function setTab(tab) {
  currentTab = tab;
  txFilter = 'all';
  txSearch = '';
  catSeleccionada = null;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['simon','alejandra','hogar'][i]===tab));
  renderTab(tab);
}

function presupuestoPorCategoria(tab) {
  const progreso = allData[tab]?.progreso || [];
  const porCat = {};
  progreso.forEach(r => {
    const cat = r['Categoria'];
    if (!cat) return;
    porCat[cat] = (porCat[cat] || 0) + (r['Presupuesto'] || 0);
  });
  return porCat;
}

// Recomendaciones basadas en el historial real (hoja Presupuesto)
function generarRecomendaciones(tab) {
  const hist = historial[tab];
  if (!hist || !hist.meses.length) return [];
  const pres = presupuestoPorCategoria(tab);
  const mesActual = new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');
  const mesesHistoricos = hist.meses.filter(m => m !== mesActual);

  const recs = [];
  Object.keys(hist.porCat).forEach(cat => {
    if (cat === 'Por Definir') return;
    const presCat = pres[cat] || 0;
    if (presCat === 0) return;

    const historicos = mesesHistoricos.map(m => hist.porCat[cat][m] || 0).filter(v => v > 0);
    if (historicos.length < 3) return;

    const promedio = historicos.reduce((s,v)=>s+v,0) / historicos.length;
    const excesos = historicos.filter(v => v > presCat).length;
    const porcentajeExceso = Math.round((promedio - presCat) / presCat * 100);

    if (excesos >= Math.ceil(historicos.length * 0.6) && promedio > presCat * 1.1) {
      const nuevoSugerido = Math.ceil(promedio / 10000) * 10000;
      recs.push({
        tipo: 'danger',
        icon: '📈',
        titulo: `Considera subir presupuesto de ${cat}`,
        desc: `Has excedido <b>${cat}</b> en <b>${excesos} de ${historicos.length} meses</b>. Promedio: <b>${fmt(promedio)}</b> vs presupuesto <b>${fmt(presCat)}</b> (+${porcentajeExceso}%). Sugerencia: subirlo a <b>${fmt(nuevoSugerido)}</b>.`
      });
    } else if (promedio < presCat * 0.5 && historicos.filter(v => v < presCat * 0.6).length >= Math.ceil(historicos.length * 0.7)) {
      const nuevoSugerido = Math.ceil(promedio * 1.2 / 10000) * 10000;
      recs.push({
        tipo: 'default',
        icon: '📉',
        titulo: `Puedes reducir presupuesto de ${cat}`,
        desc: `Solo usas en promedio <b>${fmt(promedio)}</b> de los <b>${fmt(presCat)}</b> asignados (${pct(promedio,presCat)}%). Podrías reducirlo a <b>${fmt(nuevoSugerido)}</b> y reasignar la diferencia.`
      });
    }

    const gastoMesActual = hist.porCat[cat][mesActual] || 0;
    const diaHoy = new Date().getDate();
    const diasMes = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const proyeccion = diaHoy > 0 ? gastoMesActual / diaHoy * diasMes : 0;
    if (proyeccion > promedio * 1.3 && gastoMesActual > 0 && historicos.length >= 2) {
      const incPct = Math.round((proyeccion - promedio) / promedio * 100);
      recs.push({
        tipo: 'warn',
        icon: '⚠️',
        titulo: `${cat} va acelerado este mes`,
        desc: `Proyección al cierre: <b>${fmt(proyeccion)}</b>, un <b>+${incPct}%</b> sobre tu promedio histórico de ${fmt(promedio)}. Revisa gastos recientes.`
      });
    }
  });

  return recs;
}

function filtrarTransacciones(tab) {
  const mesActual = new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');
  let txs = (allData.tx || []).filter(r => {
    if (tab === 'hogar') return (r['Bucket']||'').toLowerCase() === 'ambos';
    return (r['Persona']||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'') === tab;
  });

  if (txFilter === 'mes-actual') {
    txs = txs.filter(r => {
      const mes = r['Mes'] ? String(r['Mes']).substring(0,7) : mesDeFecha(r['Fecha']);
      return mes === mesActual;
    });
  }

  if (txSearch) {
    const q = txSearch.toLowerCase();
    txs = txs.filter(r => {
      const comercio = String(r['Comercio']||'').toLowerCase();
      const subcat = String(r['Subcategoría']||'').toLowerCase();
      const cat = String(r['Categoría']||'').toLowerCase();
      return comercio.includes(q) || subcat.includes(q) || cat.includes(q);
    });
  }

  txs.sort((a,b) => {
    const da = parseFecha(a['Fecha']);
    const db = parseFecha(b['Fecha']);
    if (!da || !db) return 0;
    return db - da;
  });

  return txs;
}

function updateSearch(val) { txSearch = val; renderTxList(); }
function toggleFilter(f) { txFilter = f; renderTxList(); }
function seleccionarCategoria(cat) { catSeleccionada = cat; renderEvolucion(); }

function renderTxList() {
  const txs = filtrarTransacciones(currentTab);
  const el = document.getElementById('tx-list-container');
  if (!el) return;
  el.innerHTML = renderTxs(txs);
  document.getElementById('tx-count').textContent = txs.length + ' transacciones';
  document.querySelectorAll('.tx-filter').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === txFilter);
  });
}

function renderTxs(txs) {
  if (!txs.length) return `<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Sin transacciones</div>`;
  return txs.map(r => {
    const cat = r['Categoría']||'';
    const icon = CAT_ICONS[cat]||'💳';
    const bg = cat==='Entretenimiento'?'rgba(167,139,250,.15)':cat==='Hogar'?'rgba(79,124,247,.15)':cat==='Transporte'?'rgba(251,191,36,.15)':'rgba(52,211,153,.15)';
    const estado = r['Estado'] || '';
    const estadoBadge = estado === 'REVISAR' ? `<span class="badge badge-warn" style="margin-left:6px">REVISAR</span>` : '';
    return `<div class="tx-row">
      <div class="tx-icon" style="background:${bg}">${icon}</div>
      <div class="tx-info">
        <div class="tx-name">${r['Comercio']||'—'}${estadoBadge}</div>
        <div class="tx-meta">${fmtFecha(r['Fecha'])} · ${r['Subcategoría']||'—'}</div>
      </div>
      <div class="tx-amount">${fmt(r['Monto']||0)}</div>
    </div>`;
  }).join('');
}

function renderEvolucion() {
  const hist = historial[currentTab];
  const pres = presupuestoPorCategoria(currentTab);
  const el = document.getElementById('evo-container');
  if (!el) return;

  if (!hist || !hist.meses.length) {
    el.innerHTML = `<div class="rec-empty">Sin historial disponible todavía</div>`;
    return;
  }

  // Deduplicar categorías: solo las que están en el presupuesto activo
  const catsPresupuesto = Object.keys(pres);
  const cats = Object.keys(hist.porCat).filter(c => c !== 'Por Definir');
  // Mantener el orden del presupuesto si está disponible, sino alfabético
  cats.sort((a, b) => {
    const ia = catsPresupuesto.indexOf(a);
    const ib = catsPresupuesto.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  if (!catSeleccionada || !cats.includes(catSeleccionada)) {
    catSeleccionada = cats[0] || null;
  }

  const pills = cats.map(c => {
    const active = c === catSeleccionada;
    return `<span class="cat-pill ${active?'active':''}" onclick="seleccionarCategoria('${c.replace(/'/g,"\\'")}')">${CAT_ICONS[c]||'•'} ${c}</span>`;
  }).join('');

  if (!catSeleccionada) {
    el.innerHTML = `<div class="cat-selector">${pills}</div><div class="rec-empty">Sin datos</div>`;
    return;
  }

  const datosCat = hist.meses.map(m => hist.porCat[catSeleccionada]?.[m] || 0);
  const presCat = pres[catSeleccionada] || 0;
  const datosNoCero = datosCat.filter(v => v > 0);
  const promedio = datosNoCero.length ? datosNoCero.reduce((s,v)=>s+v,0) / datosNoCero.length : 0;
  const mesActualIdx = hist.meses.length - 1;
  const gastoMesActual = datosCat[mesActualIdx] || 0;
  const gastoMesAnterior = datosCat[mesActualIdx - 1] || 0;
  const incPct = gastoMesAnterior > 0 ? Math.round((gastoMesActual - gastoMesAnterior) / gastoMesAnterior * 100) : null;
  const diffPromedio = promedio > 0 ? Math.round((gastoMesActual - promedio) / promedio * 100) : 0;

  el.innerHTML = `
    <div class="cat-selector">${pills}</div>
    <div class="evo-summary">
      <div class="evo-stat">
        <div class="evo-stat-label">Promedio histórico</div>
        <div class="evo-stat-value">${fmt(promedio)}</div>
        <div class="evo-stat-sub">${datosNoCero.length} meses con datos</div>
      </div>
      <div class="evo-stat">
        <div class="evo-stat-label">Mes actual</div>
        <div class="evo-stat-value ${gastoMesActual > promedio ? 'red' : 'green'}">${fmt(gastoMesActual)}</div>
        <div class="evo-stat-sub ${diffPromedio > 0 ? 'red' : 'green'}">${diffPromedio>=0?'+':''}${diffPromedio}% vs promedio</div>
      </div>
      <div class="evo-stat">
        <div class="evo-stat-label">vs mes anterior</div>
        <div class="evo-stat-value ${incPct !== null && incPct > 0 ? 'red' : 'green'}">${incPct !== null ? (incPct>=0?'+':'')+incPct+'%' : '—'}</div>
        <div class="evo-stat-sub">${fmt(gastoMesAnterior)} → ${fmt(gastoMesActual)}</div>
      </div>
      <div class="evo-stat">
        <div class="evo-stat-label">Presupuesto</div>
        <div class="evo-stat-value blue">${fmt(presCat)}</div>
        <div class="evo-stat-sub">${promedio > presCat ? '⚠️ Promedio supera presupuesto' : '✅ Promedio bajo presupuesto'}</div>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="evo-chart"></canvas></div>
  `;

  requestAnimationFrame(() => {
    const ctx = document.getElementById('evo-chart');
    if (!ctx) return;
    if (charts.evo) charts.evo.destroy();

    const colorPrincipal = CAT_COLORS[catSeleccionada] || '#4f7cf7';
    const barColors = datosCat.map((_, i) => i === mesActualIdx ? colorPrincipal : colorPrincipal + '99');
    const labels = hist.meses.map(nombreMes);

    charts.evo = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: catSeleccionada,
          data: datosCat,
          backgroundColor: barColors,
          borderRadius: 4,
          borderWidth: 0,
          datalabels: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 20 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => `${fmt(ctx.raw)}`,
              afterLabel: ctx => {
                const idx = ctx.dataIndex;
                if (idx === 0) return '';
                const prev = datosCat[idx-1];
                if (prev === 0) return '';
                const inc = Math.round((ctx.raw - prev) / prev * 100);
                return `vs mes anterior: ${inc>=0?'+':''}${inc}%`;
              }
            }
          },
          annotation: {
            annotations: {
              promedio: {
                type: 'line',
                yMin: promedio,
                yMax: promedio,
                borderColor: '#fbbf24',
                borderWidth: 2,
                borderDash: [6, 4],
                label: {
                  display: true,
                  content: `Prom: ${fmtS(promedio)}`,
                  position: 'end',
                  backgroundColor: 'rgba(251,191,36,.95)',
                  color: '#1a1d27',
                  font: { size: 10, weight: 'bold' },
                  padding: 4,
                  borderRadius: 4
                }
              },
              presupuesto: presCat > 0 ? {
                type: 'line',
                yMin: presCat,
                yMax: presCat,
                borderColor: '#4f7cf7',
                borderWidth: 2,
                borderDash: [2, 2],
                label: {
                  display: true,
                  content: `Ppto: ${fmtS(presCat)}`,
                  position: 'start',
                  backgroundColor: 'rgba(79,124,247,.95)',
                  color: 'white',
                  font: { size: 10, weight: 'bold' },
                  padding: 4,
                  borderRadius: 4
                }
              } : undefined
            }
          }
        },
        scales: {
          y: { ticks: { callback: v=>fmtS(v), color: '#6b7280', font:{size:10} }, grid: { color: 'rgba(255,255,255,.05)' }, beginAtZero: true },
          x: { ticks: { color: '#9ca3af', font:{size:11} }, grid: { display: false } }
        }
      },
      plugins: [{
        id: 'incrementos',
        afterDatasetsDraw(chart) {
          const { ctx: cctx, data } = chart;
          const meta = chart.getDatasetMeta(0);
          const vals = data.datasets[0].data;
          meta.data.forEach((bar, i) => {
            if (i === 0 || vals[i - 1] === 0) return;
            const inc = Math.round((vals[i] - vals[i - 1]) / vals[i - 1] * 100);
            const txt = `${inc>=0?'▲':'▼'}${Math.abs(inc)}%`;
            cctx.save();
            cctx.fillStyle = inc > 0 ? '#f87171' : (inc < 0 ? '#34d399' : '#9ca3af');
            cctx.font = 'bold 10px -apple-system, sans-serif';
            cctx.textAlign = 'center';
            cctx.fillText(txt, bar.x, bar.y - 6);
            cctx.restore();
          });
        }
      }]
    });
  });
}

function renderTab(tab) {
  const d = allData[tab];
  if (!d) return;
  const progreso = d.progreso || [];
  const flujo    = d.flujo || [];

  const totalPres = progreso.reduce((s,r)=>s+(r['Presupuesto']||0),0);
  const totalGast = progreso.reduce((s,r)=>s+(r['Gastado']||0),0);
  const totalDisp = totalPres - totalGast;
  const ingreso   = flujo.length ? (flujo[0]['Ingreso']||0) : 0;
  const pctEjec   = pct(totalGast, totalPres);
  const alertas   = progreso.filter(r=>r['Estado']==='EXCEDIDO'||r['Estado']==='ALERTA');

  let html = '';

  if (alertas.length) {
    const exc = alertas.filter(r=>r['Estado']==='EXCEDIDO');
    const warn = alertas.filter(r=>r['Estado']==='ALERTA');
    if (exc.length) html += `<div class="alert-banner">⚠️ <b>Excedido:</b> ${exc.map(r=>r['Subcategoria']).join(', ')}</div>`;
    if (warn.length) html += `<div class="alert-banner" style="background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:var(--yellow)">🟡 <b>En alerta (≥90%):</b> ${warn.map(r=>r['Subcategoria']).join(', ')}</div>`;
  }

  html += `<div class="metrics">`;
  if (ingreso) html += `<div class="metric"><div class="metric-label">Ingreso</div><div class="metric-value green">${fmt(ingreso)}</div></div>`;
  html += `<div class="metric"><div class="metric-label">Presupuesto</div><div class="metric-value">${fmt(totalPres)}</div></div>`;
  html += `<div class="metric"><div class="metric-label">Gastado</div><div class="metric-value ${pctEjec>=100?'red':pctEjec>=90?'yellow':'blue'}">${fmt(totalGast)}</div><div class="metric-sub">${pctEjec}% ejecutado</div></div>`;
  html += `<div class="metric"><div class="metric-label">Disponible</div><div class="metric-value ${totalDisp<0?'red':'green'}">${fmt(totalDisp)}</div></div>`;
  if (ingreso) html += `<div class="metric"><div class="metric-label">Libre (ingreso-gastado)</div><div class="metric-value ${ingreso-totalGast<0?'red':'green'}">${fmt(ingreso-totalGast)}</div></div>`;
  html += `</div>`;

  // Grid: progreso + presupuesto vs gastado
  html += `<div class="grid2">`;
  html += `<div class="card"><div class="card-title">Progreso del mes</div>`;
  const cats = [...new Set(progreso.map(r=>r['Categoria']))];
  cats.forEach(cat => {
    const items = progreso.filter(r=>r['Categoria']===cat);
    const catP  = items.reduce((s,r)=>s+(r['Presupuesto']||0),0);
    const catG  = items.reduce((s,r)=>s+(r['Gastado']||0),0);
    const catD  = catP - catG;
    const p2    = pct(catG,catP);
    const pctBadgeClass = p2>100?'badge-danger':p2>=100?'badge-complete':p2>=90?'badge-warn':'badge-ok';

    html += `<div class="cat-header">
      <div class="cat-header-top">
        <span class="cat-name">${CAT_ICONS[cat]||'•'} ${cat}</span>
        <span class="cat-pct ${pctBadgeClass}">${p2}%</span>
      </div>
      <div class="cat-stats">
        <span class="cat-stat pres"><span>Presupuesto:</span> <span class="val">${fmt(catP)}</span></span>
        <span class="cat-stat gast"><span>Gastado:</span> <span class="val">${fmt(catG)}</span></span>
        <span class="cat-stat disp ${catD>=0?'pos':'neg'}"><span>Disponible:</span> <span class="val">${fmt(catD)}</span></span>
      </div>
    </div>`;

    items.forEach(r => {
      const g  = r['Gastado']||0;
      const p  = r['Presupuesto']||0;
      const disp = p - g;
      const p3 = pct(g, p);
      const badge = p3>100?'badge-danger':p3>=100?'badge-complete':p3>=90?'badge-warn':'badge-ok';
      const label = p3>100?'Excedido':p3>=100?'Completado':p3>=90?'Alerta':'OK';
      html += `<div class="progress-item">
        <div class="progress-header">
          <span class="progress-name">${r['Subcategoria']}</span>
          <span style="display:flex;align-items:center;gap:6px">
            <span class="progress-vals">${fmt(g)} / ${fmt(p)}</span>
            <span class="badge ${badge}">${label}</span>
          </span>
        </div>
        <div class="progress-disponible ${disp>=0?'pos':'neg'}">
          <span class="disp-label">Disponible:</span> <span class="disp-val">${fmt(disp)}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(p3,100)}%;background:${barColor(p3)}"></div></div>
      </div>`;
    });
  });
  html += `</div>`;

  html += `<div class="card"><div class="card-title">Presupuesto vs. gastado</div><div class="chart-wrap"><canvas id="bar-chart"></canvas></div></div>`;
  html += `</div>`;

  // Flujo de caja
  html += `<div class="card" style="margin-bottom:16px"><div class="card-title">Flujo de caja mensual</div><div style="overflow-x:auto"><table class="flujo-table">`;
  const meses = flujo.map(r=>String(r['Mes']||'').substring(0,7));
  html += `<tr><th>Concepto</th>${meses.map(m=>`<th>${m}</th>`).join('')}</tr>`;
  html += `<tr class="gastos"><td>Gastos</td>${flujo.map(r=>`<td>${fmt(r['Gastos']||0)}</td>`).join('')}</tr>`;
  if (ingreso) {
    html += `<tr class="ingreso"><td>Ingreso</td>${flujo.map(r=>`<td>${fmt(r['Ingreso']||0)}</td>`).join('')}</tr>`;
    html += `<tr class="resultado"><td>Resultado</td>${flujo.map(r=>{const v=r['Resultado']||0;return`<td style="color:${v>=0?'var(--green)':'var(--red)'}">${fmt(v)}</td>`;}).join('')}</tr>`;
    html += `<tr class="acumulado"><td>Acumulado</td>${flujo.map(r=>{const v=r['Acumulado']||0;return`<td style="color:${v>=0?'var(--blue)':'var(--red)'}">${fmt(v)}</td>`;}).join('')}</tr>`;
  }
  html += `</table></div></div>`;

  // Evolución mensual por categoría
  html += `<div class="card" style="margin-bottom:16px"><div class="card-title">Evolución mensual por categoría</div><div id="evo-container"></div></div>`;

  // Grid inferior
  html += `<div class="grid2">`;
  html += `<div class="card"><div class="card-title">💡 Recomendaciones de ajuste</div><div id="rec-container"></div></div>`;
  html += `<div class="card">
    <div class="card-title">
      <span>Transacciones <span class="tx-count" id="tx-count">—</span></span>
      <input type="text" class="tx-search" placeholder="Buscar..." oninput="updateSearch(this.value)" value="${txSearch}">
    </div>
    <div class="tx-filters" style="margin-bottom:12px">
      <button class="tx-filter ${txFilter==='all'?'active':''}" data-filter="all" onclick="toggleFilter('all')">Todas</button>
      <button class="tx-filter ${txFilter==='mes-actual'?'active':''}" data-filter="mes-actual" onclick="toggleFilter('mes-actual')">Solo este mes</button>
    </div>
    <div class="tx-list" id="tx-list-container"></div>
  </div>`;
  html += `</div>`;

  document.getElementById('content').innerHTML = html;

  renderEvolucion();
  renderTxList();

  const recs = generarRecomendaciones(tab);
  const recContainer = document.getElementById('rec-container');
  if (recContainer) {
    if (!recs.length) {
      recContainer.innerHTML = `<div class="rec-empty">✨ Todo en orden. No hay recomendaciones por ahora.</div>`;
    } else {
      recContainer.innerHTML = recs.map(r => `
        <div class="rec-card ${r.tipo}">
          <div class="rec-icon">${r.icon}</div>
          <div class="rec-body">
            <div class="rec-title">${r.titulo}</div>
            <div class="rec-desc">${r.desc}</div>
          </div>
        </div>
      `).join('');
    }
  }

  requestAnimationFrame(() => {
    const barCtx = document.getElementById('bar-chart');
    if (barCtx) {
      if (charts.bar) charts.bar.destroy();
      charts.bar = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: cats,
          datasets: [
            { label: 'Presupuesto', data: cats.map(c=>progreso.filter(r=>r['Categoria']===c).reduce((s,r)=>s+(r['Presupuesto']||0),0)), backgroundColor: 'rgba(79,124,247,.3)', borderColor: 'rgba(79,124,247,.8)', borderWidth: 1 },
            { label: 'Gastado', data: cats.map(c=>{const g=progreso.filter(r=>r['Categoria']===c).reduce((s,r)=>s+(r['Gastado']||0),0);return g;}), backgroundColor: cats.map(c=>{const g=progreso.filter(r=>r['Categoria']===c).reduce((s,r)=>s+(r['Gastado']||0),0);const p2=progreso.filter(r=>r['Categoria']===c).reduce((s,r)=>s+(r['Presupuesto']||0),0);const pp=pct(g,p2);return pp>100?'rgba(248,113,113,.8)':pp>=100?'rgba(52,211,153,.8)':pp>=90?'rgba(251,191,36,.8)':'rgba(52,211,153,.8)';}), borderWidth: 0 }
          ]
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v=>fmtS(v), color: '#6b7280', font:{size:10} }, grid: { color: 'rgba(255,255,255,.05)' } }, y: { ticks: { color: '#9ca3af', font:{size:11} }, grid: { display: false } } } }
      });
    }
  });
}

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>
